name: Update Seismic Data

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to fetch (overrides smart window)'
        required: false
        default: ''

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests

      - name: Run event update
        run: |
          if [ -n "${{ github.event.inputs.days }}" ]; then
            python scripts/update_events.py --days ${{ github.event.inputs.days }}
          else
            python scripts/update_events.py
          fi

      - name: Run tests
        run: |
          pip install pytest scikit-learn
          python -m pytest tests/ -v --tb=short -k "not TestProcessWaveform"

      - name: Check for data changes
        id: check_changes
        run: |
          if git diff --quiet data/ 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No data changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Data changes detected."
          fi

      - name: Commit and push updated data
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git commit -m "data: update seismic events $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
